name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install "qrcode[pil]" Pillow

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Custom instructions + allowed tools are passed via claude_args in v1.
          claude_args: |
            --append-system-prompt "This is a single-file Python project: generate_qr.py renders a branded QR code (qr_faros.png) from logo.png. Python and the dependencies (qrcode[pil], Pillow) are already installed in this job. Regenerate the QR code by running 'python generate_qr.py'. Configuration constants (URL, LOGO_PATH, OUT_PATH, LOGO_RATIO, AUTO_REMOVE_BG, BG_TOLERANCE) live at the top of generate_qr.py. There are no tests, linters, or build steps."
            --allowed-tools "Bash(python:*),Bash(pip:*)"

